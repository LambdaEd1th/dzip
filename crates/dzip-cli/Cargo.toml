[package]
name = "dzip-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Modern command-line builder, creator, extractor, and inspector for Dzip archives"
readme = "../../README.md"

[dependencies]
dzip = { version = "0.4.0", path = "../dzip", features = ["parallel", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
serde.workspace = true
toml = "1.1.4"
log.workspace = true
env_logger = "0.11"
