[package]
edition = "2024"
name = "zlib"
version = "0.113.0"
description = "Pure Rust zlib implementation calibrated to zlib 1.1.3"
homepage = "https://github.com/trifectatechfoundation/zlib-rs"
readme = "README.md"
license = "Zlib"
repository = "https://github.com/LambdaEd1th/dzip-rs"

[features]
ZLIB_DEBUG = []
__internal-fuzz = ["arbitrary"]
__internal-fuzz-disable-checksum = []
__internal-test = ["quickcheck", "dep:getrandom"]
c-allocator = []
default = [
    "std",
]
rust-allocator = []
std = ["rust-allocator"]

[lib]
path = "src/lib.rs"

[dependencies.arbitrary]
version = "1.4.2"
features = ["derive"]
optional = true

[dependencies.quickcheck]
version = "1.1.0"
features = []
optional = true
default-features = false

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies.getrandom]
version = "0.4.3"
features = ["wasm_js"]
optional = true

[dev-dependencies]
crc32fast = "1.5.0"
memoffset = "0.9.1"
quickcheck = { version = "1.1.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# These patterns mirror zlib's C control flow and ABI-width casts. Their
# necessity can vary by target, so keep every other Clippy warning strict.
[lints.clippy]
collapsible_if = "allow"
int_plus_one = "allow"
manual_inspect = "allow"
manual_is_multiple_of = "allow"
unnecessary_cast = "allow"
