[package]
name = "dzip-gui"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
authors = ["LambdaEd1th"]
description = "Cross-platform Dioxus archive manager for Dzip files"

[package.metadata.bundle]
name = "Dzip Archive"
identifier = "dev.lambdaedith.dzip"
category = "public.app-category.utilities"
short_description = "A modern Dzip archive manager"
long_description = "Open, inspect, extract, and create Dzip archives from one cross-platform interface."

[package.metadata.bundle.bin.dzip-gui]
name = "Dzip Archive"
identifier = "dev.lambdaedith.dzip"
category = "public.app-category.utilities"
short_description = "A modern Dzip archive manager"
long_description = "Open, inspect, extract, and create Dzip archives from one cross-platform interface."

[[bin]]
name = "dzip-gui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", optional = true, default-features = false, features = ["asset", "document", "hooks", "html", "launch", "logger", "macro", "signals", "warnings"] }
dzip.workspace = true
crc32fast = "1.5"
fluent-bundle = { version = "0.16", optional = true }
futures-timer = { version = "3", optional = true }
log = { workspace = true, optional = true }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }
serde.workspace = true
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_bytes.workspace = true
unic-langid = { version = "0.9", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Blob",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DragEvent",
    "ErrorEvent",
    "File",
    "FileList",
    "FileSystemDirectoryEntry",
    "FileSystemDirectoryReader",
    "FileSystemEntry",
    "FileSystemFileEntry",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Storage",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[features]
default = ["desktop"]
bundle = []
desktop = [
    "dep:dioxus",
    "dioxus/desktop",
    "dzip/parallel",
    "dep:fluent-bundle",
    "dep:futures-timer",
    "dep:log",
    "dep:rfd",
    "dep:unic-langid",
]
web = [
    "dep:dioxus",
    "dioxus/web",
    "dep:fluent-bundle",
    "dep:js-sys",
    "dep:log",
    "dep:serde-wasm-bindgen",
    "dep:unic-langid",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
