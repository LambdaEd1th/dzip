[package]
name = "dzip"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure Rust library for reading, extracting, creating, and inspecting Dzip archives"
readme = "../../README.md"
keywords = ["archive", "compression", "dzip", "gamedev"]
categories = ["compression", "encoding"]

[dependencies]
byteorder = "1.5"
bzip = { workspace = true, optional = true }
dz = { workspace = true, optional = true }
lzma = { workspace = true, optional = true }
rayon = { version = "1.12", optional = true }
serde = { workspace = true, optional = true }
zlib = { workspace = true, optional = true }

[features]
default = ["encode", "decode", "all-codecs"]
encode = []
decode = []
all-codecs = ["bzip", "dz", "lzma", "zlib"]
bzip = ["dep:bzip"]
dz = ["dep:dz"]
lzma = ["dep:lzma"]
zlib = ["dep:zlib"]
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dev-dependencies]
sha2 = "0.11"
