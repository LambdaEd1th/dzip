name: Release And Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  WEB_DIST: target/dx/dzip-gui/release/web/public

jobs:
  build_native:
    name: Build GUI (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dzip-archive-linux-x86_64
            binary: dzip-gui
            package_deb: true
          - os: ubuntu-24.04-arm
            artifact: dzip-archive-linux-aarch64
            binary: dzip-gui
            package_deb: true
          - os: macos-15
            artifact: dzip-archive-macos-aarch64
            binary: dzip-gui
            package_app: true
          - os: windows-2025-vs2026
            artifact: dzip-archive-windows-x86_64
            binary: dzip-gui.exe
            package_zip: true
          - os: windows-11-arm
            artifact: dzip-archive-windows-aarch64
            binary: dzip-gui.exe
            package_zip: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --package dzip-gui --bin dzip-gui --features bundle

      - name: Install cargo-bundle
        if: matrix.package_app == true || matrix.package_deb == true
        run: cargo install cargo-bundle --locked --version 0.10.0

      - name: Build macOS app bundle
        if: matrix.package_app == true
        run: cargo bundle --release --package dzip-gui --bin dzip-gui --format osx --features bundle

      - name: Package macOS app bundle
        if: matrix.package_app == true
        shell: bash
        run: |
          APP_PATH=$(find target/release/bundle/osx -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/Resources"
          cp -R crates/dzip-gui/assets "$APP_PATH/Contents/Resources/assets"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ matrix.artifact }}-app-${{ github.ref_name }}.zip"

      - name: Build Debian package
        if: matrix.package_deb == true
        run: cargo bundle --release --package dzip-gui --bin dzip-gui --format deb --features bundle

      - name: Package Debian bundle artifact
        if: matrix.package_deb == true
        shell: bash
        run: |
          DEB_PATH=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB_PATH"
          DEB_FILE="${{ matrix.artifact }}-${{ github.ref_name }}.deb"
          cp "$DEB_PATH" "$DEB_FILE"
          cp -R crates/dzip-gui/assets assets
          zip -r "${{ matrix.artifact }}-${{ github.ref_name }}-deb.zip" "$DEB_FILE" assets

      - name: Package binary (Windows)
        if: matrix.package_zip == true
        shell: pwsh
        run: |
          Copy-Item target/release/${{ matrix.binary }} ${{ matrix.binary }}
          Copy-Item crates/dzip-gui/assets assets -Recurse
          Compress-Archive -Path @("${{ matrix.binary }}", "assets") -DestinationPath "${{ matrix.artifact }}-${{ github.ref_name }}.zip"

      - name: Upload Windows artifact
        if: matrix.package_zip == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Upload macOS app artifact
        if: matrix.package_app == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-app
          path: ${{ matrix.artifact }}-app-${{ github.ref_name }}.zip

      - name: Upload Debian artifact
        if: matrix.package_deb == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-deb
          path: ${{ matrix.artifact }}-${{ github.ref_name }}-deb.zip

  build_cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            suffix: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
            suffix: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cross

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}

      - name: Build CLI
        shell: bash
        run: |
          CMD=cargo
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            CMD=cross
          fi
          $CMD build --release --target ${{ matrix.target }} --package dzip-cli

      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          RELEASE_NAME="dzip-cli-${{ github.ref_name }}-${{ matrix.target }}"
          ARCHIVE_NAME="${RELEASE_NAME}.zip"
          BIN_PATH="target/${{ matrix.target }}/release/dzip-cli${{ matrix.suffix }}"
          test -f "$BIN_PATH"
          mkdir "$RELEASE_NAME"
          cp "$BIN_PATH" "$RELEASE_NAME/"
          if [ -f README.md ]; then cp README.md "$RELEASE_NAME/"; fi
          if [ -f LICENSE ]; then cp LICENSE "$RELEASE_NAME/"; fi
          zip -r "$ARCHIVE_NAME" "$RELEASE_NAME"

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseName = "dzip-cli-${{ github.ref_name }}-${{ matrix.target }}"
          $binaryPath = "target/${{ matrix.target }}/release/dzip-cli${{ matrix.suffix }}"
          if (-not (Test-Path $binaryPath)) { throw "Binary not found: $binaryPath" }
          New-Item -ItemType Directory -Path $releaseName | Out-Null
          Copy-Item $binaryPath "$releaseName/"
          if (Test-Path README.md) { Copy-Item README.md "$releaseName/" }
          if (Test-Path LICENSE) { Copy-Item LICENSE "$releaseName/" }
          Compress-Archive -Path $releaseName -DestinationPath "$releaseName.zip"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: dzip-cli-${{ matrix.target }}
          path: dzip-cli-${{ github.ref_name }}-${{ matrix.target }}.zip

  build_wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Build WASM site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cd crates/dzip-gui
          RUSTUP_TOOLCHAIN=stable dx build \
            --platform web \
            --release \
            --debug-symbols=false \
            --base-path "/${REPO_NAME}/"
          cd ../..
          touch "${WEB_DIST}/.nojekyll"

      - name: Package web artifact
        run: |
          PACKAGE_NAME="dzip-archive-web-${{ github.ref_name }}.zip"
          cd "${WEB_DIST}"
          zip -r "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: dzip-archive-web
          path: dzip-archive-web-${{ github.ref_name }}.zip

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.WEB_DIST }}

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_native, build_cli, build_wasm]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  deploy_pages:
    name: Deploy To GitHub Pages
    runs-on: ubuntu-latest
    needs: build_wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
