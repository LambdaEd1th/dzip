name: Release And Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10
  WEB_DIST: target/dx/dzip-gui/release/web/public

jobs:
  validate_version:
    name: Validate Release Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Match Git tag to Cargo version
        shell: bash
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "dzip") | .version')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ -z "$PACKAGE_VERSION" || "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo version ${PACKAGE_VERSION}." >&2
            exit 1
          fi

  build_native:
    name: Build CLI + GUI (${{ matrix.artifact }})
    needs: validate_version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: dzip-linux-x86_64
            gui_binary: dzip-gui
            cli_binary: dzip-cli
            package_deb: true
          - os: ubuntu-24.04-arm
            artifact: dzip-linux-aarch64
            gui_binary: dzip-gui
            cli_binary: dzip-cli
            package_deb: true
          - os: macos-15
            artifact: dzip-macos-aarch64
            gui_binary: dzip-gui
            cli_binary: dzip-cli
            package_app: true
          - os: windows-2025-vs2026
            artifact: dzip-windows-x86_64
            gui_binary: dzip-gui.exe
            cli_binary: dzip-cli.exe
            package_zip: true
          - os: windows-11-arm
            artifact: dzip-windows-aarch64
            gui_binary: dzip-gui.exe
            cli_binary: dzip-cli.exe
            package_zip: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build CLI and GUI
        run: |
          cargo build --release --package dzip-gui --bin dzip-gui --features bundle
          cargo build --release --package dzip-cli

      - name: Install cargo-bundle
        if: matrix.package_app == true || matrix.package_deb == true
        run: cargo install cargo-bundle --locked --version 0.10.0

      - name: Build macOS app bundle
        if: matrix.package_app == true
        run: cargo bundle --release --package dzip-gui --bin dzip-gui --format osx --features bundle

      - name: Package macOS app bundle
        if: matrix.package_app == true
        shell: bash
        run: |
          APP_PATH=$(find target/release/bundle/osx -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/Resources"
          cp -R crates/dzip-gui/assets "$APP_PATH/Contents/Resources/assets"
          PACKAGE_DIR="${{ matrix.artifact }}-${{ github.ref_name }}"
          mkdir "$PACKAGE_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/$(basename "$APP_PATH")"
          cp "target/release/${{ matrix.cli_binary }}" "$PACKAGE_DIR/"
          cp README.md LICENSE "$PACKAGE_DIR/"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_DIR" "$PACKAGE_DIR.zip"

      - name: Build Debian package
        if: matrix.package_deb == true
        run: cargo bundle --release --package dzip-gui --bin dzip-gui --format deb --features bundle

      - name: Package Debian bundle artifact
        if: matrix.package_deb == true
        shell: bash
        run: |
          DEB_PATH=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB_PATH"
          PACKAGE_DIR="${{ matrix.artifact }}-${{ github.ref_name }}"
          mkdir "$PACKAGE_DIR"
          cp "$DEB_PATH" "$PACKAGE_DIR/dzip-archive-${{ github.ref_name }}.deb"
          cp "target/release/${{ matrix.cli_binary }}" "$PACKAGE_DIR/"
          cp README.md LICENSE "$PACKAGE_DIR/"
          cp -R crates/dzip-gui/assets "$PACKAGE_DIR/assets"
          zip -r "$PACKAGE_DIR.zip" "$PACKAGE_DIR"

      - name: Package binary (Windows)
        if: matrix.package_zip == true
        shell: pwsh
        run: |
          $packageDir = "${{ matrix.artifact }}-${{ github.ref_name }}"
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item "target/release/${{ matrix.gui_binary }}" "$packageDir/"
          Copy-Item "target/release/${{ matrix.cli_binary }}" "$packageDir/"
          Copy-Item crates/dzip-gui/assets "$packageDir/assets" -Recurse
          Copy-Item README.md, LICENSE "$packageDir/"
          Compress-Archive -Path $packageDir -DestinationPath "$packageDir.zip"

      - name: Upload Windows artifact
        if: matrix.package_zip == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Upload macOS app artifact
        if: matrix.package_app == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Upload Debian artifact
        if: matrix.package_deb == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

  build_wasm:
    name: Build WASM
    needs: validate_version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Build WASM site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          cd crates/dzip-gui
          RUSTUP_TOOLCHAIN=stable dx build \
            --platform web \
            --release \
            --debug-symbols=false \
            --base-path "/${REPO_NAME}/"
          cd ../..
          touch "${WEB_DIST}/.nojekyll"

      - name: Package web artifact
        run: |
          PACKAGE_NAME="dzip-archive-web-${{ github.ref_name }}.zip"
          cd "${WEB_DIST}"
          zip -r "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: dzip-archive-web
          path: dzip-archive-web-${{ github.ref_name }}.zip

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.WEB_DIST }}

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_native, build_wasm]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  deploy_pages:
    name: Deploy To GitHub Pages
    runs-on: ubuntu-latest
    needs: build_wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
