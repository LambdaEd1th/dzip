name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        run: cargo test --workspace --all-features --verbose

      - name: Check library feature boundaries
        run: |
          cargo check -p dzip --no-default-features
          cargo check -p dzip --no-default-features --features decode
          cargo check -p dzip --no-default-features --features encode
          cargo check -p dzip --all-features
          cargo test -p dzip --no-default-features --features encode --lib

      - name: Check documentation
        run: cargo test -p dzip --all-features --doc

  strict-clippy:
    name: Clippy (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            scope: native
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            scope: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            scope: native
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            scope: native
          - os: macos-latest
            target: aarch64-apple-darwin
            scope: native
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            scope: wasm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          key: clippy-${{ matrix.target }}

      - name: Strict Clippy for native workspace
        if: matrix.scope == 'native'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features \
            --target ${{ matrix.target }} --no-deps -- -D warnings

      - name: Strict Clippy for WASM workspace
        if: matrix.scope == 'wasm'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p dzip -p dzip-cli -p dz -p lzma -p zlib \
            --all-targets --all-features --target ${{ matrix.target }} \
            --no-deps -- -D warnings
          cargo clippy -p bzip --target ${{ matrix.target }} \
            --no-deps -- -D warnings

      - name: Strict Clippy for feature boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p dzip --no-default-features \
            --target ${{ matrix.target }} --no-deps -- -D warnings
          cargo clippy -p dzip --no-default-features --features decode \
            --target ${{ matrix.target }} --no-deps -- -D warnings
          cargo clippy -p dzip --no-default-features --features encode \
            --target ${{ matrix.target }} --no-deps -- -D warnings
          cargo clippy -p zlib --no-default-features \
            --target ${{ matrix.target }} --no-deps -- -D warnings
