name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  codec-platforms:
    name: Codecs (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: macOS aarch64
            os: macos-15
          - name: Windows x86_64
            os: windows-2025-vs2026
          - name: Windows aarch64
            os: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test codecs and original dzip fixtures
        run: |
          cargo +stable test -p bzip -p dz -p lzma -p zlib
          cargo +stable test -p dzip --test codec_compatibility
          cargo +stable test -p dzip-cli --test dz_cli_roundtrip native_fixtures_repack_extract_and_match_dz_bytes

      - name: Clippy codecs and integration layer
        run: cargo +stable clippy -p bzip -p dz -p lzma -p zlib -p dzip -p dzip-cli --all-targets --all-features --no-deps -- -D warnings

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +stable fmt --all --check

      - name: Check native workspace
        run: cargo +stable check --workspace --all-targets

      - name: Check Web GUI
        run: cargo +stable check -p dzip-gui --no-default-features --features web --target wasm32-unknown-unknown

      - name: Check WASM libraries and CLI
        run: |
          cargo +stable check -p dzip -p dzip-cli -p dz -p lzma -p zlib \
            --all-targets --all-features --target wasm32-unknown-unknown
          cargo +stable check -p bzip --target wasm32-unknown-unknown

      - name: Test native workspace
        run: cargo +stable test --workspace --all-targets

      - name: Check library feature boundaries
        run: |
          cargo +stable check -p dzip --no-default-features
          cargo +stable check -p dzip --no-default-features --features decode
          cargo +stable check -p dzip --no-default-features --features encode
          cargo +stable check -p dzip --all-features
          cargo +stable check -p dz --no-default-features
          cargo +stable test -p dzip --no-default-features --features encode --lib
          cargo +stable test -p dzip --all-features --doc

      - name: Clippy native workspace
        run: cargo +stable clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Clippy Web GUI
        run: cargo +stable clippy -p dzip-gui --no-default-features --features web --target wasm32-unknown-unknown --no-deps -- -D warnings

      - name: Clippy WASM libraries and CLI
        run: |
          cargo +stable clippy -p dzip -p dzip-cli -p dz -p lzma -p zlib \
            --all-targets --all-features --target wasm32-unknown-unknown \
            --no-deps -- -D warnings
          cargo +stable clippy -p bzip --target wasm32-unknown-unknown \
            --no-deps -- -D warnings

      - name: Clippy feature boundaries
        run: |
          cargo +stable clippy -p dzip --no-default-features --no-deps -- -D warnings
          cargo +stable clippy -p dzip --no-default-features --features decode --no-deps -- -D warnings
          cargo +stable clippy -p dzip --no-default-features --features encode --no-deps -- -D warnings
          cargo +stable clippy -p dz --no-default-features --no-deps -- -D warnings
          cargo +stable clippy -p zlib --no-default-features --no-deps -- -D warnings

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Build web
        working-directory: crates/dzip-gui
        run: RUSTUP_TOOLCHAIN=stable dx build --platform web --release --debug-symbols=false
