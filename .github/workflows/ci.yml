name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  rust:
    name: Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +stable fmt --all --check

      - name: Check native workspace
        run: cargo +stable check --workspace --all-targets

      - name: Check Web GUI and worker
        run: |
          cargo +stable check -p dzip-gui --no-default-features --features web --target wasm32-unknown-unknown
          cargo +stable check -p dzip-gui-worker --target wasm32-unknown-unknown

      - name: Check portable application layers
        run: |
          cargo +stable check -p dzip-cli -p dzip-dcl -p dzip-workflow \
            --all-targets --all-features --target wasm32-unknown-unknown

      - name: Test native workspace
        run: cargo +stable test --workspace --all-targets

      - name: Test dzip.exe compatibility through the CLI
        run: cargo +stable test -p dzip-cli --test dz_cli_roundtrip native_fixtures_repack_extract_and_match_dz_bytes

      - name: Check workflow feature boundaries
        run: |
          cargo +stable check -p dzip-workflow --no-default-features
          cargo +stable check -p dzip-workflow --no-default-features --features dcl
          cargo +stable check -p dzip-workflow --no-default-features --features protocol
          cargo +stable check -p dzip-workflow --all-features
          cargo +stable test -p dzip-workflow --all-features

      - name: Clippy native workspace
        run: cargo +stable clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Clippy Web GUI and worker
        run: |
          cargo +stable clippy -p dzip-gui --no-default-features --features web --target wasm32-unknown-unknown --no-deps -- -D warnings
          cargo +stable clippy -p dzip-gui-worker --target wasm32-unknown-unknown --no-deps -- -D warnings

      - name: Clippy portable application layers
        run: |
          cargo +stable clippy -p dzip-cli -p dzip-dcl -p dzip-workflow \
            --all-targets --all-features --target wasm32-unknown-unknown \
            --no-deps -- -D warnings

      - name: Clippy workflow feature boundaries
        run: |
          cargo +stable clippy -p dzip-workflow --no-default-features --no-deps -- -D warnings
          cargo +stable clippy -p dzip-workflow --all-features --all-targets --no-deps -- -D warnings

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Install wasm-pack
        run: cargo +stable install wasm-pack --version 0.15.0 --locked

      - name: Build web worker
        run: |
          wasm-pack build crates/dzip-worker \
            --target web \
            --release \
            --no-opt \
            --out-dir ../dzip-gui/assets/worker/pkg \
            --out-name dzip_gui_worker
          rm -f crates/dzip-gui/assets/worker/pkg/.gitignore

      - name: Build web
        run: RUSTUP_TOOLCHAIN=stable dx build --package dzip-gui --platform web --release --debug-symbols=false
