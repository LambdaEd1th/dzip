[workspace]
members = [
    "crates/dzip",
    "crates/dzip-cli",
    "crates/codecs/bzip",
    "crates/codecs/dz",
    "crates/codecs/lzma",
    "crates/codecs/zlib",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
repository = "https://github.com/LambdaEd1th/dzip-rs"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
