[workspace]
members = [
    "crates/dzip-dcl",
    "crates/dzip-workflow",
    "crates/dzip-cli",
    "crates/dzip-gui",
    "crates/dzip-worker",
]
default-members = [
    "crates/dzip-dcl",
    "crates/dzip-workflow",
    "crates/dzip-cli",
]
exclude = ["vendor/dzip"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
repository = "https://github.com/LambdaEd1th/dzip-tools"
license = "AGPL-3.0-or-later"
# Releases are distributed as GitHub artifacts rather than registry packages.
publish = false

[workspace.dependencies]
crc32fast = "1.5"
dzip = { path = "vendor/dzip" }
dzip-dcl = { path = "crates/dzip-dcl" }
dzip-workflow = { path = "crates/dzip-workflow" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
